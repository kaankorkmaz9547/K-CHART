
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-CHART</title>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#e5e7eb;font-family:Arial,sans-serif}
header{height:58px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #293449}
h2{font-size:19px;margin:0;color:#38bdf8}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#111827}
button,select,input{background:#1e293b;color:white;border:1px solid #334155;padding:8px;border-radius:6px;cursor:pointer}
button:hover{background:#334155}
button.active{background:#0369a1}
input[type=color]{width:42px;height:34px;padding:2px}
#chart{height:calc(100vh - 145px);min-height:400px;width:100%}
.settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0f172a;font-size:13px}
.settings label{display:flex;align-items:center;gap:6px}
@media(max-width:600px){#chart{height:65vh}.toolbar{gap:5px}button,select{padding:7px;font-size:12px}}
</style>
</head>
<body>

<header>
<h2>K-CHART</h2>
<span style="font-size:12px;color:#94a3b8">Trading Analysis</span>
</header>

<div class="toolbar">
<select id="symbol">
<option value="BTCUSDT">BTCUSDT</option>
<option value="ETHUSDT">ETHUSDT</option>
<option value="SOLUSDT">SOLUSDT</option>
</select>

<select id="interval">
<option value="1m">1 Dakika</option>
<option value="5m">5 Dakika</option>
<option value="15m">15 Dakika</option>
<option value="1h" selected>1 Saat</option>
<option value="4h">4 Saat</option>
<option value="1d">1 Gün</option>
</select>

<button id="ema20">EMA 20</button>
<button id="ema50">EMA 50</button>
<button id="ema200">EMA 200</button>
<button id="trend">Trend Çizgisi</button>
<button id="horizontal">Yatay Çizgi</button>
<button id="clearDrawings">Çizimleri Sil</button>
</div>

<div class="settings">
<label>Arka plan <input type="color" id="bgColor" value="#080d18"></label>
<label>Yükseliş <input type="color" id="upColor" value="#22c55e"></label>
<label>Düşüş <input type="color" id="downColor" value="#ef4444"></label>
<button id="saveSettings">Ayarları Kaydet</button>
<button id="saveDrawings">Çizimleri Kaydet</button>
<button id="killZones">Kill Zones</button>
</div>

<div id="chart"></div>

<script>
const chartElement=document.getElementById('chart');

let bgColor='#080d18';
let upColor='#22c55e';
let downColor='#ef4444';

const chart=LightweightCharts.createChart(chartElement,{
width:chartElement.clientWidth,
height:chartElement.clientHeight,
layout:{
background:{type:'solid',color:bgColor},
textColor:'#d1d5db'
},
grid:{
vertLines:{color:'#172033'},
horzLines:{color:'#172033'}
},
crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
rightPriceScale:{borderColor:'#334155'},
timeScale:{
borderColor:'#334155',
timeVisible:true,
secondsVisible:false
}
});

const candles=chart.addCandlestickSeries({
upColor:upColor,
downColor:downColor,
borderUpColor:upColor,
borderDownColor:downColor,
wickUpColor:upColor,
wickDownColor:downColor
});

let candleData=[];
let emaSeries={};
let drawingMode=null;
let drawings=[];
let killZonesVisible=false;

async function loadData(){
const symbol=document.getElementById('symbol').value;
const interval=document.getElementById('interval').value;
try{
const response=await fetch(
`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=1000`
);
if(!response.ok)throw new Error('Veri alınamadı');
const data=await response.json();

candleData=data.map(d=>({
time:Math.floor(d[0]/1000),
open:Number(d[1]),
high:Number(d[2]),
low:Number(d[3]),
close:Number(d[4])
}));

candles.setData(candleData);
updateEMAs();
chart.timeScale().fitContent();
}catch(error){
console.error(error);
alert('Grafik verisi alınamadı. İnternet bağlantısını kontrol et.');
}
}

function calculateEMA(data,period){
const k=2/(period+1);
let ema=data[0].close;
return data.map((d,i)=>{
ema=i===0?d.close:d.close*k+ema*(1-k);
return {time:d.time,value:ema};
});
}

function updateEMAs(){
[20,50,200].forEach(period=>{
if(emaSeries[period]){
emaSeries[period].setData(calculateEMA(candleData,period));
}
});
}

function toggleEMA(period){
if(emaSeries[period]){
chart.removeSeries(emaSeries[period]);
delete emaSeries[period];
document.getElementById('ema'+period).classList.remove('active');
}else{
const colors={20:'#facc15',50:'#38bdf8',200:'#c084fc'};
emaSeries[period]=chart.addLineSeries({
color:colors[period],
lineWidth:2,
priceLineVisible:false,
lastValueVisible:true
});
emaSeries[period].setData(calculateEMA(candleData,period));
document.getElementById('ema'+period).classList.add('active');
}
}

document.getElementById('ema20').onclick=()=>toggleEMA(20);
document.getElementById('ema50').onclick=()=>toggleEMA(50);
document.getElementById('ema200').onclick=()=>toggleEMA(200);

document.getElementById('symbol').onchange=loadData;
document.getElementById('interval').onchange=loadData;

document.getElementById('bgColor').oninput=e=>{
bgColor=e.target.value;
chart.applyOptions({layout:{background:{type:'solid',color:bgColor}}});
};

function updateCandleColors(){
candles.applyOptions({
upColor,downColor,
borderUpColor:upColor,
borderDownColor:downColor,
wickUpColor:upColor,
wickDownColor:downColor
});
}

document.getElementById('upColor').oninput=e=>{
upColor=e.target.value;updateCandleColors();
};
document.getElementById('downColor').oninput=e=>{
downColor=e.target.value;updateCandleColors();
};

// AYARLARI KAYDET
document.getElementById('saveSettings').onclick=()=>{
localStorage.setItem('kchartSettings',JSON.stringify({
bgColor,upColor,downColor
}));
alert('Ayarlar kaydedildi!');
};

// AYARLARI YÜKLE
function loadSettings(){
const saved=localStorage.getItem('kchartSettings');
if(!saved)return;
const s=JSON.parse(saved);
bgColor=s.bgColor||bgColor;
upColor=s.upColor||upColor;
downColor=s.downColor||downColor;

document.getElementById('bgColor').value=bgColor;
document.getElementById('upColor').value=upColor;
document.getElementById('downColor').value=downColor;

chart.applyOptions({
layout:{background:{type:'solid',color:bgColor}}
});
updateCandleColors();
}

// ÇİZİM ARAÇLARI
const trendButton=document.getElementById('trend');
const horizontalButton=document.getElementById('horizontal');

trendButton.onclick=()=>{
drawingMode=drawingMode==='trend'?null:'trend';
trendButton.classList.toggle('active',drawingMode==='trend');
horizontalButton.classList.remove('active');
};

horizontalButton.onclick=()=>{
drawingMode=drawingMode==='horizontal'?null:'horizontal';
horizontalButton.classList.toggle('active',drawingMode==='horizontal');
trendButton.classList.remove('active');
};

chart.subscribeClick(param=>{
if(!drawingMode||!param.point||!param.time)return;

const price=candles.coordinateToPrice(param.point.y);
if(price===null)return;

if(drawingMode==='horizontal'){
const line=candles.createPriceLine({
price,
color:'#facc15',
lineWidth:2,
lineStyle:LightweightCharts.LineStyle.Solid,
axisLabelVisible:true,
title:'Yatay'
});
drawings.push({type:'horizontal',price});
}

if(drawingMode==='trend'){
drawings.push({
type:'trend',
time:param.time,
price
});
}

drawingMode=null;
trendButton.classList.remove('active');
horizontalButton.classList.remove('active');
});

// ÇİZİMLERİ KAYDET
document.getElementById('saveDrawings').onclick=()=>{
localStorage.setItem('kchartDrawings',JSON.stringify(drawings));
alert('Çizim verileri kaydedildi!');
};

// ÇİZİMLERİ SİL
document.getElementById('clearDrawings').onclick=()=>{
if(!confirm('Bütün çizimleri silmek istiyor musun?'))return;
drawings=[];
localStorage.removeItem('kchartDrawings');
alert('Çizimler temizlendi. Sayfayı yenile.');
};

// NEW YORK KILL ZONES
let killZoneLines=[];

function addKillZones(){
killZoneLines.forEach(line=>chart.removeSeries(line));
killZoneLines=[];

if(!killZonesVisible)return;

const zones=[
{hour:2,minute:0,title:'Asia'},
{hour:7,minute:0,title:'London'},
{hour:9,minute:30,title:'New York AM'},
{hour:13,minute:30,title:'New York PM'}
];

const formatter=new Intl.DateTimeFormat('en-US',{
timeZone:'America/New_York',
year:'numeric',
month:'2-digit',
day:'2-digit'
});

const now=new Date();
const today=formatter.formatToParts(now);
const parts={};
today.forEach(p=>parts[p.type]=p.value);

zones.forEach(zone=>{
const dateString=`${parts.year}-${parts.month}-${parts.day}T${String(zone.hour).padStart(2,'0')}:${String(zone.minute).padStart(2,'0')}:00`;

const date=new Date(dateString+'Z');
const utc=date.getTime();
const offset=new Date(utc).toLocaleString('en-US',{timeZone:'America/New_York'});
const nyDate=new Date(offset);

const localTime=Date.UTC(
Number(parts.year),
Number(parts.month)-1,
Number(parts.day),
zone.hour,
zone.minute
);

const utcTime=localTime+((new Date(localTime).getTimezoneOffset())*60000);

const line=chart.addLineSeries({
color:'#a78bfa',
lineWidth:1,
lineStyle:LightweightCharts.LineStyle.Dashed,
priceLineVisible:false,
lastValueVisible:false,
crosshairMarkerVisible:false
});

const first=candleData[0];
const last=candleData[candleData.length-1];
if(first&&last){
const y=(first.high+last.low)/2;
line.setData([
{time:first.time,value:y},
{time:last.time,value:y}
]);
}
killZoneLines.push(line);
});
}

document.getElementById('killZones').onclick=()=>{
killZonesVisible=!killZonesVisible;
document.getElementById('killZones').classList.toggle('active',killZonesVisible);
addKillZones();
};

// EKRAN BOYUTU
window.addEventListener('resize',()=>{
chart.applyOptions({
width:chartElement.clientWidth,
height:chartElement.clientHeight
});
});

// BAŞLAT
loadSettings();
loadData();
</script>
</body>
</html>
